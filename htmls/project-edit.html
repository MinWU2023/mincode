<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#faf7f2" />
  <title>编辑项目</title>
  <link rel="stylesheet" href="assets/app.css" />
</head>
<body>
  <div class="app-shell">
    <div class="preview-banner">静态 HTML 预览 · 暖白主题</div>

    <header class="app-header">
      <h1>编辑项目</h1>
      <div class="sub">📁 Documents/www</div>
    </header>

    <main class="app-main">
      <div class="card">
        <span class="card-title">Agent 配置</span>
        <div class="field"><label>名称</label><input type="text" value="官网前端" /></div>
        <div class="field"><label>Agent 站点 URL</label><input type="url" value="https://abs.is-best.net/agent" /></div>
        <div class="field"><label>Agent ID</label><input type="number" value="1" /></div>
        <div class="field"><label>默认模型</label><input type="text" value="deepseek-chat" /></div>
        <div class="field"><label>站点访问密码（可选）</label><input type="password" placeholder="••••••" /></div>
        <button class="btn btn-ghost btn-block" type="button">测试 Agent 连接</button>
        <p class="hint-text" style="margin-top:10px">连接成功：ok</p>
      </div>

      <div class="card">
        <span class="card-title">本地目录</span>
        <p class="card-meta">📁 Documents/www · 沙盒内 128 个文件</p>
        <button class="btn btn-ghost btn-block" type="button">↻ 同步到 App 沙盒</button>
        <button class="btn btn-ghost btn-block" type="button">📱 写回修改到手机（3）</button>
      </div>

      <div class="card">
        <span class="card-title">FTP</span>
        <div class="field"><label>主机</label><input type="text" value="ftp.example.com" /></div>
        <div class="field"><label>端口</label><input type="number" value="21" /></div>
        <div class="field"><label>用户名</label><input type="text" value="webuser" /></div>
        <div class="field"><label>密码</label><input type="password" value="••••••" /></div>
        <div class="field"><label>远程根目录</label><input type="text" value="/public_html" /></div>
        <div class="field"><label>路径前缀</label><input type="text" placeholder="本地路径映射到 FTP 的子目录" /></div>
      </div>

      <a class="btn btn-primary btn-block" href="index.html" style="text-decoration:none">保存并设为当前</a>
      <button class="btn btn-danger btn-block" type="button">删除项目</button>
      <p style="margin-top:16px"><a href="projects.html" class="section-link">← 返回项目列表</a></p>
    </main>

    <nav class="tab-bar">
      <a href="index.html"><span class="tab-icon">⌂</span><span>首页</span></a>
      <a href="chat.html"><span class="tab-icon">◉</span><span>对话</span></a>
      <a href="projects.html" class="active"><span class="tab-icon">▤</span><span>项目</span></a>
      <a href="ftp.html"><span class="tab-icon">⇪</span><span>文件</span></a>
    </nav>
  </div>
</body>
</html>
