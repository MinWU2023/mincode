<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#faf7f2" />
  <title>mincode · 首页</title>
  <link rel="stylesheet" href="assets/app.css" />
  <link rel="icon" type="image/png" href="assets/icon.png" />
</head>
<body>
  <div class="app-shell">
    <div class="preview-banner">静态 HTML 预览 · 暖白主题</div>

    <header class="app-header">
      <h1>mincode</h1>
      <div class="sub">移动端 AI 编程助手 · 多项目 · 本地改码 · FTP 同步</div>
    </header>

    <main class="app-main">
      <div class="card">
        <span class="card-title">当前项目</span>
        <div class="project-name">官网前端</div>
        <div class="card-meta">
          <div class="meta-row"><span>📁</span><span>Documents/www</span></div>
          <div class="meta-row"><span>🌐</span><span>https://abs.is-best.net/agent</span></div>
        </div>
        <div class="btn-row">
          <a class="btn btn-primary" href="chat.html">开始改代码</a>
          <a class="btn btn-ghost" href="ftp.html">文件管理</a>
        </div>
      </div>

      <div class="card">
        <span class="card-title">工作流</span>
        <ol class="flow-list">
          <li>项目里配置 Agent 地址（与网页版 agent/ 相同）</li>
          <li>选择手机本地代码目录</li>
          <li>对话中 AI 读写本地沙盒中的项目文件</li>
          <li>改完后一键 FTP 上传变更文件</li>
        </ol>
      </div>

      <a href="settings.html" class="section-link">全局设置 →</a>
    </main>

    <nav class="tab-bar">
      <a href="index.html" class="active"><span class="tab-icon">⌂</span><span>首页</span></a>
      <a href="chat.html"><span class="tab-icon">◉</span><span>对话</span></a>
      <a href="projects.html"><span class="tab-icon">▤</span><span>项目</span></a>
      <a href="ftp.html"><span class="tab-icon">⇪</span><span>文件</span></a>
    </nav>
  </div>
</body>
</html>
